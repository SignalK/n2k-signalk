name: CI format & test

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']
  # The schema is a ^ range and there is no lockfile, so this run tests
  # against each new schema release even when nothing else changes.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x, 26.x]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run build
      - run: npm run ci-format
      - run: npm test
        env:
          CI: true
